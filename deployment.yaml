apiVersion: apps/v1
kind: Deployment
metadata:
  name: interior-website-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: interior-website
  template:
    metadata:
      labels:
        app: interior-website
    spec:
      containers:
      - name: interior-website
        image: sharathmuddam/my-interior:latest
        ports:
        - containerPort: 80
